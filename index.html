
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuaForge — Deobfuscator</title>

<style>
:root {
  --bg:#080b12;
  --panel:#111827;
  --border:#273449;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --accent:#8b5cf6;
  --green:#34d399;
}

* { box-sizing:border-box }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,sans-serif;
}

header {
  padding:24px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo {
  font-size:23px;
  font-weight:900;
}

.logo span { color:var(--accent) }

.badge {
  color:var(--green);
  font-size:11px;
  border:1px solid #235442;
  padding:5px 9px;
  border-radius:20px;
}

main {
  max-width:1400px;
  margin:auto;
  padding:24px;
}

.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}

button,.upload {
  background:#1c2637;
  border:1px solid var(--border);
  color:white;
  padding:11px 15px;
  border-radius:9px;
  cursor:pointer;
  font-weight:600;
}

button:hover,.upload:hover {
  border-color:var(--accent);
}

.primary {
  background:var(--accent);
  border-color:var(--accent);
}

.upload input { display:none }

.workspace {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.panel-header {
  display:flex;
  justify-content:space-between;
  padding:13px;
  border-bottom:1px solid var(--border);
  font-size:12px;
  font-weight:700;
}

textarea {
  width:100%;
  height:480px;
  resize:vertical;
  background:#090e18;
  color:#c4f1d8;
  border:0;
  outline:0;
  padding:16px;
  font:13px/1.7 monospace;
  tab-size:2;
}

textarea::placeholder { color:#64748b }

.options {
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  padding:15px 0;
  color:var(--muted);
  font-size:12px;
}

input[type=checkbox] {
  accent-color:var(--accent);
}

.status {
  color:var(--muted);
  margin:14px 0;
  font-size:12px;
}

.cards {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:15px;
}

.card b {
  display:block;
  font-size:19px;
  margin-bottom:5px;
}

.card span {
  color:var(--muted);
  font-size:12px;
}

.findings {
  margin-top:15px;
  padding:15px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:800px) {
  .workspace { grid-template-columns:1fr }
  textarea { height:350px }
  main { padding:14px }
  header { padding:16px }
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">Lua<span>Forge</span></div>
    <small style="color:#94a3b8">
      Lua source transformation engine
    </small>
  </div>

  <div class="badge">LOCAL ANALYSIS</div>
</header>

<main>

  <div class="toolbar">

    <label class="upload">
      Open Lua File
      <input type="file" id="file" accept=".lua,.luau,.txt">
    </label>

    <button class="primary" id="run">
      Deobfuscate
    </button>

    <button id="sample">
      Sample
    </button>

    <button id="copy">
      Copy Output
    </button>

    <button id="download">
      Download Lua
    </button>

    <button id="clear">
      Clear
    </button>

  </div>

  <div class="options">

    <label>
      <input type="checkbox" id="fold" checked>
      Constant Folding
    </label>

    <label>
      <input type="checkbox" id="strings" checked>
      String Decoding
    </label>

    <label>
      <input type="checkbox" id="comments">
      Remove Comments
    </label>

    <label>
      <input type="checkbox" id="format" checked>
      Format Code
    </label>

  </div>

  <div class="workspace">

    <section class="panel">
      <div class="panel-header">
        <span>INPUT SOURCE</span>
        <span id="inputCount">0 lines</span>
      </div>

      <textarea
        id="input"
        spellcheck="false"
        placeholder="Paste your obfuscated Lua code here..."
      ></textarea>
    </section>

    <section class="panel">
      <div class="panel-header">
        <span>DEOBFUSCATED SOURCE</span>
        <span id="outputCount">Waiting</span>
      </div>

      <textarea
        id="output"
        spellcheck="false"
        readonly
        placeholder="Cleaned Lua code appears here..."
      ></textarea>
    </section>

  </div>

  <div class="status" id="status">
    Ready. No input has been processed.
  </div>

  <div class="cards">

    <div class="card">
      <b id="detected">Unknown</b>
      <span>Detected obfuscator</span>
    </div>

    <div class="card">
      <b id="passes">0</b>
      <span>Transformations</span>
    </div>

    <div class="card">
      <b id="reduction">0%</b>
      <span>Size reduction</span>
    </div>

  </div>

  <div class="findings" id="findings">
    Analysis findings will appear here.
  </div>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const input = $("input");
const output = $("output");

let transformationCount = 0;

/* ----------------------------------
   OBfuscator Detection
---------------------------------- */

function detectObfuscator(source) {

  const signatures = {
    Luraph: [
      /luraph/i,
      /LPH_[A-Za-z0-9_]+/,
      /LuraphObfuscator/i
    ],

    MoonSec: [
      /moonsec/i,
      /MoonSecV\d+/i
    ],

    Minevile: [
      /minevile/i,
      /MinevileObfuscator/i
    ],

    Obfuscar: [
      /obfuscar/i
    ]
  };

  let best = "Unknown";
  let score = 0;

  for (const [name, patterns] of Object.entries(signatures)) {

    const matches = patterns.filter(
      pattern => pattern.test(source)
    ).length;

    if (matches > score) {
      score = matches;
      best = name;
    }
  }

  if (best !== "Unknown") {
    return best;
  }

  if (
    source.length > 1000 &&
    /while\s+true\s+do/.test(source) &&
    /string\.char/.test(source)
  ) {
    return "Generic Lua Obfuscator";
  }

  return "Unknown";
}

/* ----------------------------------
   Safe Lua Comment Removal
---------------------------------- */

function removeComments(source) {

  let result = "";
  let i = 0;

  while (i < source.length) {

    const c = source[i];
    const next = source[i + 1];

    // Quoted strings must remain intact.
    if (c === "'" || c === '"') {

      const quote = c;
      result += c;
      i++;

      while (i < source.length) {

        const ch = source[i];

        result += ch;
        i++;

        if (ch === "\\") {

          if (i < source.length) {
            result += source[i++];
          }

          continue;
        }

        if (ch === quote) {
          break;
        }
      }

      continue;
    }

    // Long bracket strings.
    if (c === "[") {

      const match = source
        .slice(i)
        .match(/^\[(=*)\[/);

      if (match) {

        const closing = "]" + match[1] + "]";

        const end = source.indexOf(
          closing,
          i + match[0].length
        );

        if (end !== -1) {

          result += source.slice(
            i,
            end + closing.length
          );

          i = end + closing.length;
          continue;
        }
      }
    }

    // Single-line comments.
    if (c === "-" && next === "-") {

      i += 2;

      while (
        i < source.length &&
        source[i] !== "\n"
      ) {
        i++;
      }

      continue;
    }

    // Long comments.
    if (c === "-" && next === "-") {

      const match = source
        .slice(i + 2)
        .match(/^\[(=*)\[/);

      if (match) {

        const closing = "]" + match[1] + "]";

        const end = source.indexOf(
          closing,
          i + 2 + match[0].length
        );

        if (end !== -1) {
          i = end + closing.length;
          continue;
        }
      }
    }

    result += c;
    i++;
  }

  return result;
}

/* ----------------------------------
   String Escape Decoder
---------------------------------- */

function decodeStrings(source) {

  const replacements = {
    "\\n": "\n",
    "\\r": "\r",
    "\\t": "\t",
    "\\\\": "\\",
    "\\\"": '"',
    "\\'": "'"
  };

  return source.replace(
    /(["'])(?:\\.|[^\\])*?\1/g,
    literal => {

      const quote = literal[0];

      let body = literal.slice(1, -1);

      body = body.replace(
        /\\(?:x[0-9a-fA-F]{2}|\d{1,3}|.)/g,
        escape => {

          if (replacements[escape]) {
            return replacements[escape];
          }

          if (/^\\x[0-9a-fA-F]{2}$/.test(escape)) {

            return String.fromCharCode(
              parseInt(escape.slice(2), 16)
            );
          }

          if (/^\\\d{1,3}$/.test(escape)) {

            return String.fromCharCode(
              Math.min(
                255,
                parseInt(escape.slice(1), 10)
              )
            );
          }

          return escape;
        }
      );

      return quote + body + quote;
    }
  );
}

/* ----------------------------------
   Constant Folding
   No eval() or script execution.
---------------------------------- */

function foldConstants(source) {

  let count = 0;

  const pattern =
    /(?<![\w.])\(?-?\d+(?:\.\d+)?(?:\s*[+\-*\/%]\s*-?\d+(?:\.\d+)?)+\)?(?![\w.])/g;

  const result = source.replace(
    pattern,
    expression => {

      const clean = expression
        .replace(/[()]/g, "")
        .replace(/\s+/g, "");

      if (!/^[\d.+\-*/%]+$/.test(clean)) {
        return expression;
      }

      const tokens = clean.match(
        /-?\d+(?:\.\d+)?|[+\-*/%]/g
      );

      if (!tokens) {
        return expression;
      }

      let values = [];
      let operators = [];

      const precedence = {
        "+": 1,
        "-": 1,
        "*": 2,
        "/": 2,
        "%": 2
      };

      function apply() {

        const b = values.pop();
        const a = values.pop();
        const op = operators.pop();

        let value;

        switch (op) {

          case "+":
            value = a + b;
            break;

          case "-":
            value = a - b;
            break;

          case "*":
            value = a * b;
            break;

          case "/":
            value = a / b;
            break;

          case "%":
            value = a % b;
            break;
        }

        if (!Number.isFinite(value)) {
          throw new Error("Invalid numeric result");
        }

        values.push(value);
      }

      try {

        for (const token of tokens) {

          if (/^-?\d/.test(token)) {

            values.push(Number(token));

          } else {

            while (
              operators.length &&
              precedence[
                operators[operators.length - 1]
              ] >= precedence[token]
            ) {
              apply();
            }

            operators.push(token);
          }
        }

        while (operators.length) {
          apply();
        }

        const result = values[0];

        if (
          !Number.isFinite(result) ||
          Math.abs(result) > 1e15
        ) {
          return expression;
        }

        count++;

        return Number.isInteger(result)
          ? String(result)
          : String(Number(result.toPrecision(12)));

      } catch {

        return expression;
      }
    }
  );

  return {
    source: result,
    count
  };
}

/* ----------------------------------
   Conservative Formatter
---------------------------------- */

function formatLua(source) {

  const lines = source
    .replace(/\r\n?/g, "\n")
    .split("\n");

  let depth = 0;

  return lines.map(raw => {

    const line = raw.trim();

    if (!line) {
      return "";
    }

    if (/^(end|until|else|elseif)\b/.test(line)) {
      depth = Math.max(0, depth - 1);
    }

    const formatted =
      "  ".repeat(depth) + line;

    const opens =
      (line.match(/\b(function|then|do|repeat)\b/g) || [])
        .length;

    const closes =
      (line.match(/\bend\b|\buntil\b/g) || [])
        .length;

    depth = Math.max(
      0,
      depth + opens - closes
    );

    return formatted;

  }).join("\n");
}

/* ----------------------------------
   Main Transformation Pipeline
---------------------------------- */

function deobfuscate() {

  const original = input.value;

  if (!original.trim()) {

    $("status").textContent =
      "Paste a Lua script first.";

    return;
  }

  let source = original;

  transformationCount = 0;

  const findings = [];

  const detected = detectObfuscator(original);

  // Stage 1: Remove comments.
  if ($("comments").checked) {

    const before = source;

    source = removeComments(source);

    if (before !== source) {

      transformationCount++;

      findings.push(
        "Removed comments while preserving strings."
      );
    }
  }

  // Stage 2: Decode literal strings.
  if ($("strings").checked) {

    const before = source;

    source = decodeStrings(source);

    if (before !== source) {

      transformationCount++;

      findings.push(
        "Decoded supported string escapes."
      );
    }
  }

  // Stage 3: Fold arithmetic.
  if ($("fold").checked) {

    const folded = foldConstants(source);

    source = folded.source;

    transformationCount += folded.count;

    if (folded.count) {

      findings.push(
        `Folded ${folded.count} numeric expression(s).`
      );
    }
  }

  // Stage 4: Formatting.
  if ($("format").checked) {

    source = formatLua(source);

    findings.push(
      "Applied conservative source formatting."
    );
  }

  output.value = source;

  $("detected").textContent = detected;

  $("passes").textContent =
    transformationCount;

  const reduction = original.length
    ? Math.round(
        (1 - source.length / original.length) * 100
      )
    : 0;

  $("reduction").textContent =
    reduction + "%";

  $("inputCount").textContent =
    original.split("\n").length + " lines";

  $("outputCount").textContent =
    source.split("\n").length + " lines";

  $("findings").innerHTML =
    findings.length
      ? findings.map(
          item => "✓ " + item
        ).join("<br>")
      : "No safe transformations were applicable.";

  $("status").textContent =
    "Finished. Input was not executed.";
}

/* ----------------------------------
   Interface
---------------------------------- */

$("run").addEventListener(
  "click",
  deobfuscate
);

$("file").addEventListener(
  "change",
  async event => {

    const file = event.target.files[0];

    if (!file) return;

    input.value = await file.text();

    $("inputCount").textContent =
      input.value.split("\n").length + " lines";

    $("status").textContent =
      "Loaded " + file.name;
  }
);

$("sample").addEventListener(
  "click",
  () => {

    input.value = `
local a = 10 + 20
local b = 5 * 6
local message = "hello\\\\x20world"

if 2 + 2 == 4 then
    print(message, a, b)
end
`;

    $("status").textContent =
      "Sample loaded.";
  }
);

$("copy").addEventListener(
  "click",
  async () => {

    if (!output.value) return;

    try {

      await navigator.clipboard.writeText(
        output.value
      );

      $("status").textContent =
        "Output copied.";

    } catch {

      output.select();

      $("status").textContent =
        "Select and copy the output.";
    }
  }
);

$("download").addEventListener(
  "click",
  () => {

    if (!output.value) return;

    const blob = new Blob(
      [output.value],
      { type: "text/plain;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);

    const anchor = document.createElement("a");

    anchor.href = url;
    anchor.download = "cleaned.lua";

    anchor.click();

    URL.revokeObjectURL(url);
  }
);

$("clear").addEventListener(
  "click",
  () => {

    input.value = "";
    output.value = "";

    $("detected").textContent = "Unknown";
    $("passes").textContent = "0";
    $("reduction").textContent = "0%";

    $("findings").textContent =
      "Analysis findings will appear here.";

    $("status").textContent =
      "Workspace cleared.";
  }
);

</script>
</body>
</html>
