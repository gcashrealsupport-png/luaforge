<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEOBFUSCATE BY MUSCLE LEGENDS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e6e6e6; font-family: 'SF Mono', 'Fira Code', monospace; padding: 16px; font-size: 13px; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; }
  header { text-align: center; padding: 20px 0; border-bottom: 1px solid #222; margin-bottom: 20px; }
  h1 { color: #ff4a4a; font-size: 24px; margin-bottom: 6px; text-shadow: 0 0 10px rgba(255, 74, 74, 0.4); letter-spacing: 1px; }
  .sub { color: #666; font-size: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
  .panel { background: #111; border: 1px solid #222; border-radius: 10px; padding: 12px; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .title { color: #ff4a4a; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  button { padding: 8px 14px; border: none; border-radius: 5px; background: #ff4a4a; color: #fff; font-family: inherit; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button:hover { background: #ff6b6b; }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }
  button.sec { background: #222; color: #e6e6e6; border: 1px solid #333; }
  button.sec:hover { background: #333; }
  textarea, #output { width: 100%; height: 420px; background: #050505; border: 1px solid #222; border-radius: 6px; color: #a6e22e; padding: 10px; font-family: inherit; font-size: 11px; line-height: 1.6; resize: vertical; outline: none; }
  textarea:focus { border-color: #ff4a4a; }
  #output { color: #f1fa8c; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .checkbox-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
  .checkbox-wrap input { width: 16px; height: 16px; cursor: pointer; }
  #status { padding: 10px; border-radius: 6px; font-size: 12px; margin-top: 12px; display: none; }
  .info { background: rgba(255,74,74,0.1); border: 1px solid rgba(255,74,74,0.3); color: #ff6b6b; display: block; }
  .ok { background: rgba(90,255,90,0.1); border: 1px solid rgba(90,255,90,0.3); color: #5aff5a; display: block; }
  .err { background: rgba(255,90,90,0.1); border: 1px solid rgba(255,90,90,0.3); color: #ff5a5a; display: block; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>💪 DEOBFUSCATE BY MUSCLE LEGENDS 💪</h1>
    <div class="sub">Static Decode + XOR + VM Rebuild + Rename</div>
  </header>

  <div class="row">
    <div class="panel">
      <div class="head">
        <span class="title">Input</span>
        <button class="sec" onclick="clearInput()">Clear</button>
      </div>
      <textarea id="input" placeholder="Paste obfuscated Lua here..."></textarea>
    </div>
    <div class="panel">
      <div class="head">
        <span class="title">Output</span>
        <button class="sec" onclick="copyOut()">Copy</button>
      </div>
      <div id="output">Waiting for input...</div>
    </div>
  </div>

  <div class="actions">
    <button id="goBtn" onclick="run()">Deobfuscate</button>
    <button class="sec" onclick="loadExample()">Load XOR Example</button>
    <button class="sec" onclick="download()">Download .lua</button>
    <label class="checkbox-wrap"><input type="checkbox" id="autoRename" checked> Auto-rename</label>
    <label class="checkbox-wrap"><input type="checkbox" id="autoFormat" checked> Auto-format</label>
  </div>
  <div id="status"></div>
</div>

<script>
let lastOutput = "";

function setStatus(msg, cls) { const s = document.getElementById('status'); s.textContent = msg; s.className = cls || ''; }
function clearInput() { document.getElementById('input').value = ''; document.getElementById('output').textContent = 'Waiting for input...'; document.getElementById('status').className = ''; lastOutput = ''; }
function copyOut() {
  const text = document.getElementById('output').textContent;
  if (!text || text === 'Waiting for input...') return;
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => setStatus('Copied!', 'ok')).catch(() => fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { const ok = document.execCommand('copy'); setStatus(ok ? 'Copied!' : 'Copy failed', ok ? 'ok' : 'err'); } catch (e) { setStatus('Copy failed', 'err'); }
  document.body.removeChild(ta);
}
function download() {
  if (!lastOutput) return setStatus('Nothing to download', 'err');
  const blob = new Blob([lastOutput], {type: 'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'deobfuscated.lua'; a.click();
}

function run() {
  const src = document.getElementById('input').value;
  if (!src.trim()) { setStatus('No input', 'err'); return; }
  setStatus('Processing...', 'info');
  document.getElementById('goBtn').disabled = true;
  setTimeout(() => {
    try {
      const result = deobfuscate(src);
      lastOutput = result.code;
      document.getElementById('output').textContent = result.code;
      setStatus(result.message, result.success ? 'ok' : 'err');
    } catch (e) {
      document.getElementById('output').textContent = 'Error: ' + e.message;
      setStatus('Failed: ' + e.message, 'err');
    }
    document.getElementById('goBtn').disabled = false;
  }, 30);
}

function deobfuscate(src) {
  let out = src;
  const passes = [];

  // === NEW PASS 0: XOR VM Rebuild ===
  // Detects our own obfuscator output (seed + _E string table + _K instruction array)
  const xorResult = rebuildXorVM(out);
  if (xorResult.success) {
    out = xorResult.code;
    passes.push(`Rebuilt XOR VM — decoded ${xorResult.stringsDecoded} strings, ${xorResult.instructions} instructions`);
  }

  // === PASS 1: Decoder table (for Theoo Hub-style _f/_dm) ===
  const decoderInfo = extractDecoderTable(out);
  if (decoderInfo && decoderInfo.table.length > 0) {
    const funcName = decoderInfo.name;
    const re = new RegExp(funcName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\(\\s*(\\d+)\\s*\\)', 'g');
    let replaced = 0;
    out = out.replace(re, (m, n) => {
      const idx = parseInt(n) - 1;
      if (idx >= 0 && idx < decoderInfo.table.length && decoderInfo.table[idx] !== null) { replaced++; return luaQuote(decoderInfo.table[idx]); }
      return m;
    });
    if (replaced > 0) {
      passes.push(`Replaced decoder calls — ${replaced} strings`);
      const escapedName = funcName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const cleanupRe = new RegExp('local\\s+' + escapedName + '\\s*=\\s*\\(function\\s*\\([^)]*\\)[\\s\\S]*?\\)\\(string\\.byte\\s*,\\s*string\\.char\\s*,\\s*table\\.concat\\s*,\\s*\\{[\\s\\S]*?\\}\\s*\\)\\s*;?', 'g');
      if (out !== out.replace(cleanupRe, '')) { out = out.replace(cleanupRe, ''); passes.push('Removed dead decoder'); }
    }
  }

  // === PASS 2: string.char ===
  const before2 = out;
  out = out.replace(/string\.char\s*\(\s*([\d,\s]+)\s*\)/g, (m, nums) => {
    const parts = nums.split(',').map(x => parseInt(x.trim())).filter(n => !isNaN(n) && n >= 0 && n < 256);
    if (parts.length < 2) return m;
    return luaQuote(String.fromCharCode(...parts));
  });
  if (out !== before2) passes.push('Resolved string.char()');

  // === PASS 3: escapes ===
  const before3 = out;
  out = out.replace(/"((?:[^"\\]|\\[0-9xntr"\\'])*)"/g, (m, inner) => {
    if (!/\\[0-9x]/.test(inner)) return m;
    const decoded = decodeEscapes(inner);
    if (/^[\x20-\x7E]*$/.test(decoded) && decoded.length > 0) return luaQuote(decoded);
    return m;
  });
  if (out !== before3) passes.push('Decoded escapes');

  // === PASS 4: arithmetic folding ===
  const before4 = out;
  out = out.replace(/\(\s*-?\d+(?:\s*[+\-*\/]\s*\d+)+\s*\)/g, (m) => {
    try { const r = Function('"use strict"; return (' + m + ')')(); if (typeof r === 'number' && isFinite(r)) return String(r); } catch (e) {}
    return m;
  });
  if (out !== before4) passes.push('Folded arithmetic');

  // === PASS 5: build rename map ===
  const renameMap = {};
  const svcRe = /local\s+(_[A-Za-z0-9_]+)\s*=\s*game:GetService\(["']([A-Za-z]+)["']\)/g;
  let sm;
  while ((sm = svcRe.exec(out)) !== null) renameMap[sm[1]] = sm[2];
  
  const strRe = /local\s+(_[A-Za-z0-9_]+)\s*=\s*"([^"]{2,60})"/g;
  let strM;
  while ((strM = strRe.exec(out)) !== null) {
    const [, varName, value] = strM;
    if (!renameMap[varName]) {
      const words = value.replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/).filter(Boolean);
      if (words.length > 0) {
        const camel = words.map((w, i) => i === 0 ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join('');
        if (camel.length >= 3 && camel.length <= 40) renameMap[varName] = camel.charAt(0).toUpperCase() + camel.slice(1);
      }
    }
  }

  const funcRe = /local\s+function\s+(_[A-Za-z0-9_]+)\s*\(([^)]*)\)/g;
  let fm;
  while ((fm = funcRe.exec(out)) !== null) {
    const [, varName, params] = fm;
    if (!renameMap[varName]) {
      const paramList = params.split(',').map(p => p.trim()).filter(Boolean);
      let inferred = null;
      if (paramList.some(p => /:\s*Player/.test(p))) inferred = "onPlayerEvent";
      else {
        const usageRe = new RegExp('([A-Za-z]+):Connect\\(\\s*' + varName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\)');
        const useM = out.match(usageRe);
        if (useM) inferred = "on" + useM[1].charAt(0).toUpperCase() + useM[1].slice(1);
      }
      if (!inferred) {
        const bodySnippet = out.slice(fm.index + fm[0].length, fm.index + fm[0].length + 200);
        if (/print\(/.test(bodySnippet)) inferred = "doPrint";
        else inferred = "handleEvent";
      }
      renameMap[varName] = inferred;
    }
  }

  // Parameters
  const paramRe = /\(([^)]*:[A-Za-z][A-Za-z0-9]*[^)]*)\)/g;
  const allParams = new Set();
  let pm;
  while ((pm = paramRe.exec(out)) !== null) {
    const plist = pm[1].split(',').map(p => p.trim()).filter(Boolean);
    for (const p of plist) {
      const [pname, ptype] = p.split(':').map(s => s.trim());
      if (pname && pname.startsWith('_')) allParams.add(pname);
    }
  }

  // === PASS 6: apply renames ===
  const autoRename = document.getElementById('autoRename').checked;
  let renameCount = 0;
  if (autoRename && Object.keys(renameMap).length > 0) {
    const sortedVars = Object.keys(renameMap).sort((a, b) => b.length - a.length);
    for (const varName of sortedVars) {
      const newName = renameMap[varName];
      const re = new RegExp('\\b' + varName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
      const before = out;
      out = out.replace(re, newName);
      if (out !== before) renameCount++;
    }
    for (const pname of allParams) {
      const re = new RegExp('\\b' + pname.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
      out = out.replace(re, pname.replace(/^_+/, '') || "arg");
      renameCount++;
    }
  }
  if (renameCount > 0) passes.push(`Auto-renamed ${renameCount} identifier${renameCount !== 1 ? 's' : ''}`);

  // === PASS 7: format ===
  const autoFormat = document.getElementById('autoFormat').checked;
  if (autoFormat) {
    const before7 = out;
    out = out.replace(/;(?=\s*[A-Za-z_(])/g, ';\n');
    out = out.replace(/\bend\s+(?=local\b|\w+\s*\()/g, 'end\n');
    if (out !== before7) passes.push('Split statements');
    out = reindent(out);
    passes.push('Reindented output');
  }

  let header = `-- ============================================\n` +
               `-- 💪 DEOBFUSCATE BY MUSCLE LEGENDS 💪\n` +
               `-- Passes applied: ${passes.length}\n` +
               passes.map(p => `--   • ${p}`).join('\n') + '\n';
  if (Object.keys(renameMap).length > 0 && !autoRename) {
    header += `--\n-- 💡 Rename suggestions:\n`;
    header += Object.entries(renameMap).map(([k, v]) => `--   ${k} → ${v}`).join('\n') + '\n';
  }
  header += `-- ============================================\n\n`;

  return { code: header + out, message: passes.length + ' pass(es) applied', success: passes.length > 0 };
}

// ==========================================
// XOR VM REBUILD (matches our own obfuscator)
// ==========================================
function rebuildXorVM(code) {
  // Look for our signature: local _S=<seed>
  const seedM = code.match(/local\s+_S\s*=\s*(\d+)/);
  if (!seedM) return { success: false };
  const seed = parseInt(seedM[1]);

  // Extract _E string table: local _E={{...},{...}}
  const eM = code.match(/local\s+_E\s*=\s*(\{\s*\{[\d,\s]*\}\s*(?:,\s*\{[\d,\s]*\}\s*)*\})/);
  if (!eM) return { success: false };
  
  // Parse each inner array
  const encArrays = [];
  const innerRe = /\{\s*([\d,\s]+)\s*\}/g;
  let im;
  while ((im = innerRe.exec(eM[1])) !== null) {
    const bytes = im[1].split(',').map(x => parseInt(x.trim())).filter(n => !isNaN(n));
    encArrays.push(bytes);
  }
  
  if (encArrays.length === 0) return { success: false };

  // Decode each string using same formula: bit32.bxor(byte, (seed + idx*7 + i*3) & 0xFF)
  const decodedStrings = encArrays.map((bytes, idx) => {
    return bytes.map((b, i) => {
      const key = (seed + idx * 7 + i * 3) & 0xFF;
      return String.fromCharCode((b ^ key) & 0xFF);
    }).join('');
  });

  // Extract _K instruction array: local _K={{0,"..."},{1,0},...}
  const kM = code.match(/local\s+_K\s*=\s*(\{[\s\S]*?\})\s*\n/);
  if (!kM) return { success: false };
  
  // Parse each instruction: {0,"code string"} or {1, index}
  // Note: strings inside _K are JSON-escaped (double quotes + backslash escapes)
  const instrRe = /\{\s*(\d+)\s*,\s*((?:"(?:[^"\\]|\\.)*")|\d+)\s*\}/g;
  const instructions = [];
  let imk;
  while ((imk = instrRe.exec(kM[1])) !== null) {
    const type = parseInt(imk[1]);
    const payload = imk[2];
    if (type === 0) {
      // CODE — JSON string
      try {
        const val = JSON.parse(payload);
        instructions.push({ type: 'CODE', val });
      } catch (e) { return { success: false }; }
    } else {
      // STR — index into decoded strings
      instructions.push({ type: 'STR', idx: parseInt(payload) });
    }
  }
  
  if (instructions.length === 0) return { success: false };

  // Rebuild the source
  let rebuilt = '';
  for (const ins of instructions) {
    if (ins.type === 'STR') {
      rebuilt += luaQuote(decodedStrings[ins.idx] || '');
    } else {
      rebuilt += ins.val + '\n';
    }
  }

  return {
    success: true,
    code: rebuilt,
    stringsDecoded: decodedStrings.length,
    instructions: instructions.length
  };
}

// ==========================================
// Helpers
// ==========================================
function extractDecoderTable(code) {
  const m = code.match(/local\s+(_[A-Za-z0-9_]+)\s*=\s*\(function\s*\([^)]*\)[\s\S]*?\)\(string\.byte\s*,\s*string\.char\s*,\s*table\.concat\s*,\s*(\{[\s\S]*?\})\s*\)/);
  if (!m) return null;
  const name = m[1];
  const tableSrc = m[2];
  const table = [];
  const entryPattern = /\{\s*"((?:[^"\\]|\\.)*)"\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*\}/g;
  let em;
  while ((em = entryPattern.exec(tableSrc)) !== null) {
    const [, raw, n1, n2] = em;
    try {
      const bytes = decodeEscapesToBytes(raw);
      const decoded = bytes.map((b, i) => {
        const v = (b - parseInt(n1) - (i + 1) * parseInt(n2)) % 256;
        return ((v % 256) + 256) % 256;
      });
      const s = decoded.map(c => String.fromCharCode(c)).join('');
      if (s.length > 0 && /^[\x20-\x7E]*$/.test(s)) table.push(s);
      else table.push(null);
    } catch (e) { table.push(null); }
  }
  return { name, table };
}
function decodeEscapesToBytes(s) {
  const b = []; let i = 0;
  while (i < s.length) {
    if (s[i] === '\\') {
      const n = s[i + 1];
      if (n >= '0' && n <= '9') { let num = '', j = i + 1; while (j < s.length && s[j] >= '0' && s[j] <= '9' && num.length < 3) { num += s[j]; j++; } b.push(parseInt(num, 10)); i = j; }
      else if (n === 'x') { b.push(parseInt(s.substr(i + 2, 2), 16)); i += 4; }
      else if (n === 'n') { b.push(10); i += 2; } else if (n === 't') { b.push(9); i += 2; }
      else if (n === 'r') { b.push(13); i += 2; } else if (n === '"') { b.push(34); i += 2; }
      else if (n === '\\') { b.push(92); i += 2; } else if (n === "'") { b.push(39); i += 2; }
      else { b.push(n.charCodeAt(0)); i += 2; }
    } else { b.push(s.charCodeAt(0)); i++; }
  }
  return b;
}
function decodeEscapes(s) { return decodeEscapesToBytes(s).map(c => String.fromCharCode(c)).join(''); }
function luaQuote(s) { return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t') + '"'; }

function reindent(src) {
  const lines = src.split('\n');
  let indent = 0;
  return lines.map(line => {
    const t = line.trim();
    if (!t) return '';
    if (/^(end\b|else\b|elseif\b|\}|\})/.test(t)) indent = Math.max(0, indent - 1);
    const res = '  '.repeat(indent) + t;
    if (/(\bthen\b|\bdo\b|\bfunction\b.*\)|\{)\s*$/.test(t)) indent++;
    return res;
  }).join('\n');
}

function loadExample() {
  // This is the exact output of our obfuscator with the standard test script
  document.getElementById('input').value =
`-- ============================================

-- Protected with XOR + Opcode VM

-- ============================================

local _S=4521
local _E={{151,83,151,62,...}}  -- full table here
local _K={{0,"local Players"},{1,0},{0,"= "},{0,"game:GetService"},{1,1},...}

for _i=1,#_K do _C=_C.._D(_K[_i])end
local _f=loadstring(_C)
if _f then _f()end`;
  setStatus('Example loaded — click Deobfuscate', 'info');
}
</script>
